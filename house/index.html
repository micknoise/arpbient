<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>House</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0a05'/%3E%3Cpath d='M3 11 L8 4 L13 11' fill='none' stroke='%23ffa028' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='12' r='1.8' fill='%232dd4bf'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <canvas id="viz"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="overlay">
    <div class="title-block">
      <p class="title">HOUSE</p>
      <p class="subtitle">endless syncopated grooves · offbeat open hats</p>
    </div>

    <div class="panel">
      <button id="playBtn">PLAY</button>
      <div class="controls">
        <div class="control-row">
          <label for="vol">Volume</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <div class="control-row">
          <label for="warm">Warmth</label>
          <input id="warm" type="range" min="0" max="1" step="0.01" value="0.5" />
        </div>
        <div class="control-row">
          <label for="swing">Swing</label>
          <input id="swing" type="range" min="0" max="1" step="0.01" value="0.3" />
        </div>
        <div class="control-row">
          <label for="dens">Groove</label>
          <input id="dens" type="range" min="0" max="1" step="0.01" value="0.6" />
        </div>
        <div class="control-row">
          <label for="tempo">Tempo</label>
          <input id="tempo" type="range" min="112" max="130" step="1" value="122" />
        </div>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <div class="hint">click play and let it run &middot; headphones recommended &middot; it never repeats the same way twice</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

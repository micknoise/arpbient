<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Glitchcore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2312050c'/%3E%3Crect x='2' y='8' width='3' height='5' fill='%23ff2e88'/%3E%3Crect x='6' y='4' width='3' height='9' fill='%23ff2e88'/%3E%3Crect x='10' y='6' width='3' height='7' fill='%23c8ff00'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <canvas id="viz"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="overlay">
    <div class="title-block">
      <p class="title">GLITCHCORE</p>
      <p class="subtitle">endless breakbeat chaos · stutter stabs · hard cuts</p>
    </div>

    <div class="panel">
      <button id="playBtn">PLAY</button>
      <div class="controls">
        <div class="control-row">
          <label for="vol">Volume</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <div class="control-row">
          <label for="stutter">Stutter</label>
          <input id="stutter" type="range" min="0" max="1" step="0.01" value="0.5" />
        </div>
        <div class="control-row">
          <label for="breaks">Breaks</label>
          <input id="breaks" type="range" min="0" max="1" step="0.01" value="0.6" />
        </div>
        <div class="control-row">
          <label for="tempo">Tempo</label>
          <input id="tempo" type="range" min="140" max="170" step="1" value="150" />
        </div>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <div class="hint">click play and let it run &middot; headphones recommended &middot; it never repeats the same way twice</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Electronic Dub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050c08'/%3E%3Cpath d='M2 11 Q8 3 14 11' fill='none' stroke='%233ddc84' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='12' r='1.6' fill='%23ff5a3c'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <canvas id="viz"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="overlay">
    <div class="title-block">
      <p class="title">ELECTRONIC DUB</p>
      <p class="subtitle">endless dub · one-drop groove · skank echoes · dropouts</p>
    </div>

    <div class="panel">
      <button id="playBtn">PLAY</button>
      <div class="controls">
        <div class="control-row">
          <label for="vol">Volume</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <div class="control-row">
          <label for="echo">Echo</label>
          <input id="echo" type="range" min="0" max="1" step="0.01" value="0.6" />
        </div>
        <div class="control-row">
          <label for="drop">Dropouts</label>
          <input id="drop" type="range" min="0" max="1" step="0.01" value="0.5" />
        </div>
        <div class="control-row">
          <label for="tempo">Tempo</label>
          <input id="tempo" type="range" min="70" max="100" step="1" value="85" />
        </div>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <div class="hint">click play and let it run &middot; headphones recommended &middot; it never repeats the same way twice</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

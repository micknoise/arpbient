<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Electronica</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0714'/%3E%3Cpath d='M2 10 L5 4 L8 12 L11 6 L14 10' fill='none' stroke='%23c04cff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='11' cy='6' r='1.4' fill='%234cc9f0'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <canvas id="viz"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="overlay">
    <div class="title-block">
      <p class="title">ELECTRONICA</p>
      <p class="subtitle">endless IDM · noodle arps · gliding bass · glitch</p>
    </div>

    <div class="panel">
      <button id="playBtn">PLAY</button>
      <div class="controls">
        <div class="control-row">
          <label for="vol">Volume</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <div class="control-row">
          <label for="dens">Noodle</label>
          <input id="dens" type="range" min="0" max="1" step="0.01" value="0.6" />
        </div>
        <div class="control-row">
          <label for="glitch">Glitch</label>
          <input id="glitch" type="range" min="0" max="1" step="0.01" value="0.4" />
        </div>
        <div class="control-row">
          <label for="tempo">Tempo</label>
          <input id="tempo" type="range" min="104" max="128" step="1" value="118" />
        </div>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <div class="hint">click play and let it run &middot; headphones recommended &middot; it never repeats the same way twice</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

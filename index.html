<meta charset="UTF-8" />
<title>Wraith</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css" />

<canvas id="viz"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="overlay">
  <div class="title-block">
    <p class="title">WRAITH</p>
    <p class="subtitle">endless generative horror atmospheres</p>
  </div>

  <div class="panel">
    <button id="playBtn">PLAY</button>
    <div class="controls">
      <div class="control-row">
        <label for="vol">Volume</label>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <div class="control-row">
        <label for="dread">Dread</label>
        <input id="dread" type="range" min="0" max="1" step="0.01" value="0.55" />
      </div>
      <div class="control-row">
        <label for="tension">Tension</label>
        <input id="tension" type="range" min="0" max="1" step="0.01" value="0.55" />
      </div>
      <div class="control-row">
        <label for="tempo">Tempo</label>
        <input id="tempo" type="range" min="50" max="96" step="1" value="72" />
      </div>
    </div>
    <div id="status"></div>
  </div>
</div>

<div class="hint">click play and let it run &middot; headphones recommended &middot; it builds, detonates, and never repeats the same way twice</div>

<script type="module" src="js/main.js"></script>

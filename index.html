<meta charset="UTF-8" />
<title>Arpbient</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css" />

<canvas id="viz"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="overlay">
  <div class="title-block">
    <p class="title">ARPBIENT</p>
    <p class="subtitle">endless dark synth atmospheres</p>
  </div>

  <div class="panel">
    <button id="playBtn">PLAY</button>
    <div class="controls">
      <div class="control-row">
        <label for="vol">Volume</label>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <div class="control-row">
        <label for="dark">Darkness</label>
        <input id="dark" type="range" min="0" max="1" step="0.01" value="0.5" />
      </div>
      <div class="control-row">
        <label for="dens">Density</label>
        <input id="dens" type="range" min="0" max="1" step="0.01" value="0.6" />
      </div>
      <div class="control-row">
        <label for="tempo">Tempo</label>
        <input id="tempo" type="range" min="50" max="100" step="1" value="76" />
      </div>
    </div>
    <div id="status"></div>
  </div>
</div>

<div class="hint">click play and let it run &middot; headphones recommended &middot; it never repeats the same way twice</div>

<script type="module" src="js/main.js"></script>
